explainer_dict:
  cam:
    class: CAM
    description: "Class Activation Mapping"
    model:
      ResNet18: 
  grad_cam:
    class: GradCAM
    description: "Gradient-weighted Class Activation Mapping"
    model:
      ResNet18:
        target_layer: "layer4"
    default_target_layer: "layer4"
    
  rise:
    class: RISE
    description: "Randomized Input Sampling with Expectation"
    model:
      ResNet18:
        N: 4000
        s: 8
        p1: 0.1

