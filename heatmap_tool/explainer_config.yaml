explainer_dict:
  cam:
    class: CAM
    description: "Class Activation Mapping"
    cmap: "jet"
    type : "positive"
    model:
      ResNet18: {}
      ResNet34:
        target_layer: "res16"
  grad_cam:
    class: GradCAM
    description: "Gradient-weighted Class Activation Mapping"
    cmap: "jet"
    type : "positive"
    model:
      ResNet18:
        target_layer: "layer4"
      ResNet34:
        target_layer: "res16"
    default_target_layer: "layer4"

  rise:
    class: RISE
    description: "Randomized Input Sampling with Expectation"
    cmap: "jet"
    model:
      ResNet18:
        N: 4000
        s: 8
        p1: 0.1
  ig:
    class: IG
    type : "positive"
    description: "Integrated Gradients"
    cmap: "jet"
    slic:
      size : 10
      ruler : 5
    model:
      ResNet18:
        steps: 30

  smoothgrad:
    class: SmoothGrad
    type : "positive"
    description: "Smooth-Grad"
    camp: "gray"
    slic:
      size : 10
      ruler : 5
    model:
      ResNet18:
        num_sample: 10
        var: 0.125
      ResNet34:
        num_sample: 10
        var: 0.125
  shap:
    class: SHAP
    type : "absolute"
    description: "kernel SHAP"
    cmap: "jet"
    slic:
      forced : True
      size : 10
      ruler : 5
    model:
      ResNet18:
        sampling_size: 1000
      ResNet34:
        sampling_size: 1000
  permutation_shap:
    class: PERMUTATION_SHAP
    type : "absolute"
    description: "Permutation SHAP"
    cmap: "jet"
    slic:
      forced : True
      size : 10
      ruler : 5
    model:
      ResNet18:
        sampling_size: 1000
      ResNet34:
        sampling_size: 1000
  lmap:
      class: LMAP
      type : "absolute"
      description: "LMAP"
      cmap: "jet"
      slic:
        forced : True
        size : 10
        ruler : 5
      model:
        ResNet18:
          sampling_size: 20
        ResNet34:
          sampling_size: 20
